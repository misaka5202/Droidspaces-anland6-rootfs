name: Publish All-Wayland RootFS (Qualcomm + MediaTek)

on:
  workflow_dispatch:
    inputs:
      sync_cnb:
        description: Sync zh assets to CNB after building
        required: false
        default: false
        type: boolean
      sync_cnb_only:
        description: Skip building; sync an existing GitHub Release to CNB only
        required: false
        default: false
        type: boolean
      gpu_vendor:
        description: Which GPU variant to build
        required: true
        default: both
        type: choice
        options:
          - both
          - qualcomm
          - mediatek
      publish_release:
        description: Whether to update the GitHub Release (set false for small tests; artifacts only)
        required: false
        type: boolean
        default: true
      desktop:
        description: Which desktop to build (all-wayland for the full matrix, or a single one such as kde-mobile)
        required: true
        default: all-wayland
        type: string
      custom_release_tag:
        description: Which tag to publish to (empty = the rolling tag; use a dedicated tag for single-desktop tests)
        required: false
        default: ''
        type: string
      skip_prune:
        description: Skip pruning old Release assets not built this run (enable for single-desktop tests)
        required: false
        default: false
        type: boolean
      language:
        description: Which language to build
        required: true
        default: zh
        type: choice
        options:
          - zh
          - en
          - both
      release_tag:
        description: GitHub Release tag used in sync-only mode
        required: true
        default: droidspaces-rootfs-all-wayland
        type: string
      upload_concurrency:
        description: CNB concurrent upload count
        required: true
        default: 9999
        type: number
  schedule:
    - cron: '0 18 * * 0'

concurrency:
  group: droidspaces-rootfs-all-wayland
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: droidspaces-rootfs-all-wayland
  WAYLAND_PACKAGE_REPOSITORY: Goldzxcbug/droidspaces-package

jobs:
  prepare:
    name: Prepare unified versions
    if: ${{ inputs.sync_cnb_only != true }}
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - id: meta
        run: |
          build_epoch="$(date -u +'%s')"
          build_id="v$(date -u -d "@$build_epoch" +'%Y%m%d-%H%M%S')"
          build_time="$(date -u -d "@$build_epoch" +'%Y-%m-%d %H:%M:%S UTC')"
          printf 'build_id=%s\n' "$build_id" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$build_time" >> "$GITHUB_OUTPUT"

  build-zh-qualcomm:
    name: Build zh / Qualcomm Adreno
    if: ${{ inputs.sync_cnb_only != true && (inputs.language == 'zh' || inputs.language == 'both') && (inputs.gpu_vendor == 'both' || inputs.gpu_vendor == 'qualcomm') }}
    needs: prepare
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: zh
      build_target: all-wayland
      custom_username: Gold
      desktop: ${{ inputs.desktop }}
      desktop_autostart: true
      display_backend: anland-wayland
      PulseAudio: none
      enable_zh_tz: true
      enable_mesa: true
      enable_8gen2_wayland: false
      nosnap: true
      enable_systemd257: false
      enable_srf: true
      enable_binfmt: false
      enable_yj: true
      enable_kfgj: false
      enable_zip: true
      enable_docker: false
      wayland_package_repository: Goldzxcbug/droidspaces-package
      build_id: ${{ needs.prepare.outputs.build_id }}
      asset_variant: zh
      publish_release: false
      gpu_vendor: qualcomm

  build-zh-mediatek:
    name: Build zh / MediaTek Mali
    if: ${{ inputs.sync_cnb_only != true && (inputs.language == 'zh' || inputs.language == 'both') && (inputs.gpu_vendor == 'both' || inputs.gpu_vendor == 'mediatek') }}
    needs: prepare
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: zh
      build_target: all-wayland
      custom_username: Gold
      desktop: ${{ inputs.desktop }}
      desktop_autostart: true
      display_backend: anland-wayland
      PulseAudio: none
      enable_zh_tz: true
      enable_mesa: true
      enable_8gen2_wayland: false
      nosnap: true
      enable_systemd257: false
      enable_srf: true
      enable_binfmt: false
      enable_yj: true
      enable_kfgj: false
      enable_zip: true
      enable_docker: false
      wayland_package_repository: Goldzxcbug/droidspaces-package
      build_id: ${{ needs.prepare.outputs.build_id }}
      asset_variant: zh
      publish_release: false
      gpu_vendor: mediatek

  build-en-qualcomm:
    name: Build en / Qualcomm Adreno
    if: ${{ inputs.sync_cnb_only != true && (inputs.language == 'en' || inputs.language == 'both') && (inputs.gpu_vendor == 'both' || inputs.gpu_vendor == 'qualcomm') }}
    needs: prepare
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: en
      build_target: all-wayland
      custom_username: Gold
      desktop: ${{ inputs.desktop }}
      desktop_autostart: true
      display_backend: anland-wayland
      PulseAudio: none
      enable_zh_tz: false
      enable_mesa: true
      enable_8gen2_wayland: false
      nosnap: false
      enable_systemd257: false
      enable_srf: false
      enable_binfmt: false
      enable_yj: true
      enable_kfgj: false
      enable_zip: true
      enable_docker: false
      wayland_package_repository: Goldzxcbug/droidspaces-package
      build_id: ${{ needs.prepare.outputs.build_id }}
      asset_variant: en
      publish_release: false
      gpu_vendor: qualcomm

  build-en-mediatek:
    name: Build en / MediaTek Mali
    if: ${{ inputs.sync_cnb_only != true && (inputs.language == 'en' || inputs.language == 'both') && (inputs.gpu_vendor == 'both' || inputs.gpu_vendor == 'mediatek') }}
    needs: prepare
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: en
      build_target: all-wayland
      custom_username: Gold
      desktop: ${{ inputs.desktop }}
      desktop_autostart: true
      display_backend: anland-wayland
      PulseAudio: none
      enable_zh_tz: false
      enable_mesa: true
      enable_8gen2_wayland: false
      nosnap: false
      enable_systemd257: false
      enable_srf: false
      enable_binfmt: false
      enable_yj: true
      enable_kfgj: false
      enable_zip: true
      enable_docker: false
      wayland_package_repository: Goldzxcbug/droidspaces-package
      build_id: ${{ needs.prepare.outputs.build_id }}
      asset_variant: en
      publish_release: false
      gpu_vendor: mediatek

  release:
    name: Update the GitHub rolling Release
    needs: [prepare, build-zh-qualcomm, build-zh-mediatek, build-en-qualcomm, build-en-mediatek]
    if: ${{ !cancelled() && inputs.sync_cnb_only != true && inputs.publish_release != true }}
    runs-on: ubuntu-latest
    env:
      # Single-desktop tests use a dedicated tag to avoid polluting the rolling Release
      RELEASE_TAG: ${{ inputs.custom_release_tag || 'droidspaces-rootfs-all-wayland' }}
      SKIP_PRUNE: ${{ inputs.skip_prune }}
    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*-rootfs'
          merge-multiple: true
          path: release-assets

      - name: Generate manifests and release notes
        env:
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
        run: |
          set -euo pipefail
          archive_count=$(find release-assets -maxdepth 1 -name '*.tar.xz' | wc -l)
          echo "Archive count: $archive_count"
          [ "$archive_count" -gt 0 ] || { echo "No RootFS artifacts produced" >&2; exit 1; }
          # Only generate manifests for languages that produced artifacts (the language input may select one)
          manifests=()
          for lang in zh en; do
            if ls release-assets/*-"$lang".tar.xz >/dev/null 2>&1; then
              bash scripts/generate-rootfs-manifests.sh \
                --assets release-assets \
                --language "$lang" \
                --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}" \
                --output "release-assets/rootfs_${lang}.json"
              manifests+=("release-assets/rootfs_${lang}.json")
            else
              echo "No $lang artifacts, skipping rootfs_${lang}.json"
            fi
          done
          [ ${#manifests[@]} -gt 0 ] || { echo "No manifests to generate" >&2; exit 1; }
          jq -s 'add | sort_by(.language, .distro, .name, .architecture)' \
            "${manifests[@]}" > release-assets/rootfs.json

          notes_file="$RUNNER_TEMP/rootfs-release-notes.md"
          cat > "$notes_file" <<'EOF'
          ## English

          Rolling ARM64 RootFS collection for Droidspaces, covering 40 distribution and desktop combinations, in Qualcomm Adreno and MediaTek variants:
          - Distributions: Debian 13, Ubuntu 26.04, Fedora 43, Fedora 44, and Arch Linux.
          - Anland Wayland desktops: KDE Plasma, KDE Plasma Mobile, GNOME, Anland Next, Niri, Hyprland, Mango, and Denial.

          Each combination is available in Chinese and English and in both GPU variants; the number of archives in this release is listed under build information below. Use `rootfs_en.json` or `rootfs_zh.json` as the subscription manifest in Droidspaces RootFS management. The manifests include version, file size, SHA-256 checksum, and download URL for each image. Qualcomm images use Adreno hardware acceleration; MediaTek images use libhybris to drive the vendor Mali driver on /dev/mali0, so the host needs droidspaces-lkm with mali_nsfix loaded first. Without it the container cannot create a GPU context and eglInitialize returns 0x3001.

          The images are built for ARM64 and include Droidspaces desktop auto-start and Qualcomm Adreno/Mesa support. This rolling release is refreshed by the scheduled weekly build.
          EOF
          {
            printf '\n## Build information\n\n'
            printf '%s\n' \
              "- Build ID: $BUILD_ID" \
              "- Build time (UTC): $BUILD_TIME" \
              "- Release tag: $RELEASE_TAG" \
              '- Architecture: ARM64' \
              "- Archives: $archive_count" \
            printf '\n## Direct download index\n\n'
            printf '%s\n' \
              "- [Complete index: rootfs.json](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/rootfs.json) — every RootFS download address in this release." \
              "- [English subscription index: rootfs_en.json](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/rootfs_en.json)" \
              "- [Chinese subscription index: rootfs_zh.json](https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/rootfs_zh.json)"
          } >> "$notes_file"
          echo "ROOTFS_RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: Create or update the rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="$(cat "$ROOTFS_RELEASE_NOTES_FILE")"
          tag_ref="repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          if gh api "$tag_ref" >/dev/null 2>&1; then
            echo "Updating the existing rolling tag: $RELEASE_TAG"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            echo "Creating the rolling tag: $RELEASE_TAG"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi

          release_list="$RUNNER_TEMP/rootfs-releases.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$release_list"
          if ! jq -e --arg tag "$RELEASE_TAG" 'any(.[]; .tag_name == $tag)' "$release_list" >/dev/null; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Droidspaces All-Wayland RootFS" \
              --notes "$release_notes" \
              --draft \
              --latest=false
          fi

      - name: Upload RootFS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find release-assets -maxdepth 1 -type f -name '*.tar.xz' -print | sort)
          [ "${#archives[@]}" -gt 0 ]
          gh release upload "$RELEASE_TAG" "${archives[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          # Upload only manifests actually generated (the language input may select one)
          mapfile -t manifests < <(find release-assets -maxdepth 1 -type f -name 'rootfs*.json' -print | sort)
          [ "${#manifests[@]}" -gt 0 ] || { echo "No manifests to upload" >&2; exit 1; }
          printf 'Manifests: %s\n' "${manifests[@]}"
          gh release upload "$RELEASE_TAG" "${manifests[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Prune old assets and publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_notes="$(cat "$ROOTFS_RELEASE_NOTES_FILE")"
          expected="$RUNNER_TEMP/rootfs-expected-assets.txt"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$expected"
          release_json="$RUNNER_TEMP/rootfs-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -ce \
            --arg tag "$RELEASE_TAG" '
              [.[] | select(.tag_name == $tag)]
              | if length == 1 then .[0] else error("rolling Release is not unique") end
            ' > "$release_json"
          if [ "${SKIP_PRUNE:-false}" = "true" ]; then
            echo "SKIP_PRUNE=true, skipping old-asset pruning"
          else
            while IFS=$'\t' read -r asset_id asset_name; do
              if ! grep -Fqx -- "$asset_name" "$expected"; then
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              fi
            done < <(jq -r '.assets[] | [.id, .name] | @tsv' "$release_json")
          fi
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Droidspaces All-Wayland RootFS" \
            --notes "$release_notes" \
            --draft=false --prerelease=false --latest=false

  sync-cnb:
    name: Sync zh assets to CNB
    if: ${{ !cancelled() && inputs.sync_cnb == true && inputs.sync_cnb_only != true && inputs.publish_release != true }}
    needs: [prepare, build-zh-qualcomm, build-zh-mediatek, build-en-qualcomm, build-en-mediatek]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download zh RootFS build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*-zh-*-rootfs'
          merge-multiple: true
          path: cnb-assets

      - name: Generate the CNB zh index
        env:
          CNB_REPO: ${{ vars.CNB_REPO }}
        run: |
          set -euo pipefail
          bash scripts/generate-rootfs-manifests.sh \
            --assets cnb-assets \
            --language zh \
            --release-url "https://cnb.cool/${CNB_REPO}/-/releases/download/${RELEASE_TAG}" \
            --output cnb-assets/rootfs_zh.json
          jq . cnb-assets/rootfs_zh.json > cnb-assets/rootfs.json

      - name: Upload zh assets to CNB
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          CNB_ROOTFS_LANGUAGE: zh
          CNB_UPLOAD_CONCURRENCY: ${{ inputs.upload_concurrency }}
          BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
          CNB_LOCAL_ASSETS_DIR: cnb-assets
        run: bash scripts/publish-cnb-rootfs.sh "$RELEASE_TAG"

  sync-cnb-only:
    name: Sync an existing Release to CNB only
    if: ${{ inputs.sync_cnb_only == true }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Sync zh assets to CNB
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          CNB_ROOTFS_LANGUAGE: zh
          CNB_UPLOAD_CONCURRENCY: ${{ inputs.upload_concurrency }}
        run: bash scripts/publish-cnb-rootfs.sh "$RELEASE_TAG"

