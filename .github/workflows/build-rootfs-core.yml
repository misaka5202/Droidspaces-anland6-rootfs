name: Droidspaces RootFS Core Build

on:
  workflow_call:
    inputs:
      ui_language:
        required: false
        type: string
        default: zh
      build_target:
        required: true
        type: string
      custom_username:
        required: false
        type: string
        default: Gold
      desktop:
        required: true
        type: string
      extra_desktops:
        required: false
        type: string
        default: ''
      desktop_autostart:
        required: true
        type: boolean
      display_backend:
        required: true
        type: string
      PulseAudio:
        required: true
        type: string
      enable_zh_tz:
        required: true
        type: boolean
      enable_mesa:
        required: true
        type: boolean
      enable_8gen2_wayland:
        required: true
        type: boolean
      nosnap:
        required: true
        type: boolean
      enable_systemd257:
        required: true
        type: boolean
      enable_srf:
        required: true
        type: boolean
      enable_binfmt:
        required: true
        type: boolean
      enable_yj:
        required: true
        type: boolean
      enable_kfgj:
        required: true
        type: boolean
      enable_zip:
        required: true
        type: boolean
      enable_docker:
        required: true
        type: boolean
      wayland_package_repository:
        required: false
        type: string
        default: Goldzxcbug/droidspaces-package
      build_id:
        required: false
        type: string
        default: ''
      anland_major:
        description: 'Anland major version: 6 (anlandx session, recommended) or 5 (legacy patched KWin)'
        required: false
        type: string
        default: '6'
      anland6_version:
        description: 'The anland 6.x release tag, or latest to follow the newest release'
        required: false
        type: string
        default: 'latest'
      gpu_vendor:
        description: 'GPU vendor: qualcomm (Adreno hardware acceleration) or mediatek (libhybris + /dev/mali0, requires mali_nsfix)'
        required: false
        type: string
        default: qualcomm
      asset_variant:
        required: false
        type: string
        default: ''
      publish_release:
        required: false
        type: boolean
        default: true

jobs:
  # --------------------------------------------------------
  # Phase 1: setup (Environment preparation and variable generation)
  # --------------------------------------------------------
  setup:
    name: 'Setup'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find-templates.outputs.matrix }}
      desktop: ${{ steps.find-templates.outputs.desktop }}
      desktop_autostart: ${{ steps.find-templates.outputs.desktop_autostart }}
      display_backend: ${{ steps.find-templates.outputs.display_backend }}
      pulseaudio_effective: ${{ steps.find-templates.outputs.pulseaudio_effective }}
      build_id: ${{ steps.prep.outputs.build_id }}
      build_date: ${{ steps.prep.outputs.build_date }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 'Parse user build choices'
        id: find-templates
        env:
          BUILD_TARGET_INPUT: ${{ inputs.build_target }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
          DESKTOP_AUTOSTART_INPUT: ${{ inputs.desktop_autostart }}
          DESKTOP_INPUT: ${{ inputs.desktop }}
          EXTRA_DESKTOPS_INPUT: ${{ inputs.extra_desktops }}
          DISPLAY_BACKEND_INPUT: ${{ inputs.display_backend }}
          ENABLE_SYSTEMD257_INPUT: ${{ inputs.enable_systemd257 }}
          PULSEAUDIO_INPUT: ${{ inputs.PulseAudio }}
          UI_LANGUAGE: ${{ inputs.ui_language }}
          WAYLAND_PACKAGE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          PUBLISH_ALL_WAYLAND: ${{ inputs.desktop == 'all-wayland' }}
        run: |
          set -euo pipefail
          source scripts/lib/desktop-config.sh

          case "$UI_LANGUAGE" in
            zh|en) ;;
            *)
              echo "Unsupported UI language: $UI_LANGUAGE" >&2
              exit 1
              ;;
          esac

          message() {
            printf '%s\n' "$1"
          }

          fail() {
            message "$2" >&2
            exit 1
          }

          TARGET="$BUILD_TARGET_INPUT"

          # ---------- validations that don't depend on the desktop ----------
          if [ "$ENABLE_SYSTEMD257_INPUT" = "true" ] && [ "$TARGET" = "all-wayland" ]; then
            fail "The all-wayland build does not support the systemd 257 compatibility option." \
              "all-wayland builds do not support the systemd 257 compatibility option."
          fi
          if [[ ! "$WAYLAND_PACKAGE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            fail "The Wayland package repository must be a public owner/repo slug." \
              "Wayland package repository must use the public owner/repository format."
          fi
          if [[ ! "$CUSTOM_USERNAME" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]; then
            fail "The custom username must be a valid Linux username, 1 to 32 characters." \
              "Custom username must be a 1-32 character Linux username."
          fi

          # ---------- build the (deduplicated) desktop list ----------
          DESKTOPS=()
          add_desktop() {
            local d="$1" x
            for x in "${DESKTOPS[@]}"; do
              [ "$x" = "$d" ] && return 0
            done
            DESKTOPS+=("$d")
          }

          # trim leading/trailing whitespace and stray quotes (no xargs:
          # xargs treats quotes specially and fails hard on unbalanced ones)
          trim_value() {
            local v="$1"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            case "$v" in
              \'*\'|\"*\") v="${v:1:${#v}-2}" ;;
            esac
            v="${v//\'/}"
            v="${v//\"/}"
            printf '%s\n' "$v"
          }

          # accept full-width commas from Chinese IME input
          EXTRA_DESKTOPS_NORMALIZED="$(trim_value "${EXTRA_DESKTOPS_INPUT//$'\xef\xbc\x8c'/,}")"

          if [ "$PUBLISH_ALL_WAYLAND" = "true" ]; then
            add_desktop "all-wayland"
            if [ -n "$EXTRA_DESKTOPS_NORMALIZED" ]; then
              message "Build target is all-wayland: the extra desktops argument \"$EXTRA_DESKTOPS_INPUT\" is ignored." \
                "all-wayland target selected; the extra desktops value \"$EXTRA_DESKTOPS_INPUT\" is ignored."
            fi
          else
            PRIMARY_INPUT="$(trim_value "$DESKTOP_INPUT")"
            PRIMARY="$(desktop_normalize "$PRIMARY_INPUT")" || {
              fail "Invalid desktop: $DESKTOP_INPUT" \
                "Invalid desktop: $DESKTOP_INPUT"
            }
            add_desktop "$PRIMARY"
            IFS=',' read -ra EXTRA <<< "$EXTRA_DESKTOPS_NORMALIZED"
            for raw in "${EXTRA[@]}"; do
              raw="$(trim_value "$raw")"
              [ -n "$raw" ] || continue
              d="$(desktop_normalize "$raw")" || {
                fail "Invalid desktop: $raw"
              }
              add_desktop "$d"
            done
            if [ "${#DESKTOPS[@]}" -gt 1 ]; then
              for d in "${DESKTOPS[@]}"; do
                [ "$d" != "none" ] || fail \
                  "none cannot be combined with other desktops." \
                  "'none' cannot be combined with other desktops."
              done
            fi
          fi

          # ---------- per-desktop resolution -> matrix rows ----------
          MATRIX_FILE="$RUNNER_TEMP/rootfs-matrix.tsv"
          : > "$MATRIX_FILE"
          # columns: template, desktop, display_backend, autostart, pulseaudio
          emit() { printf '%s\t%s\t%s\t%s\t%s\n' "$@" >> "$MATRIX_FILE"; }

          for DESKTOP in "${DESKTOPS[@]}"; do
            if [ "$DESKTOP" = "none" ]; then
              DISPLAY_BACKEND="x11"
            elif [ "$DESKTOP" = "all-wayland" ]; then
              DISPLAY_BACKEND="anland-wayland"
            else
              DISPLAY_BACKEND="$(display_backend_normalize "$DISPLAY_BACKEND_INPUT")" || {
                fail "Invalid display backend: $DISPLAY_BACKEND_INPUT" \
                  "Invalid display backend: $DISPLAY_BACKEND_INPUT"
              }
            fi
            DESKTOP_AUTOSTART="$DESKTOP_AUTOSTART_INPUT"

            if [ "$ENABLE_SYSTEMD257_INPUT" = "true" ]; then
              case "$DESKTOP" in
                kde)
                  message "systemd 257 enabled: plain KDE is on the verified whitelist." \
                    "systemd 257 is enabled: standard KDE is on the verified support allowlist."
                  ;;
                none)
                  DISPLAY_BACKEND="x11"
                  DESKTOP_AUTOSTART="false"
                  ;;
                *)
                  message "systemd 257 does not support $DESKTOP yet: forcing the none desktop and disabling desktop autostart." \
                    "systemd 257 does not support $DESKTOP: forcing desktop=none and disabling desktop auto-start."
                  DESKTOP="none"
                  DISPLAY_BACKEND="x11"
                  DESKTOP_AUTOSTART="false"
                  ;;
              esac
            fi

            case "$DESKTOP" in
              kde-mobile|mobile|gnome|anland-next)
                DISPLAY_BACKEND="anland-wayland"
                ;;
            esac

            if [ "$DESKTOP" = "none" ] && [ "$DESKTOP_AUTOSTART" = "true" ]; then
              message "Desktop is none: desktop autostart disabled automatically." \
                "Desktop is none: disabling desktop auto-start automatically."
              DESKTOP_AUTOSTART="false"
            fi

            PULSE_AUDIO="$PULSEAUDIO_INPUT"
            if [ "$DISPLAY_BACKEND" = "anland-wayland" ]; then
              PULSE_AUDIO="none"
            fi

            if [ "$DESKTOP" = "all-wayland" ]; then
              [ "$TARGET" = "all-wayland" ] || fail \
                "The full Wayland desktop matrix requires the all-wayland build target." \
                "The full Wayland desktop matrix requires the all-wayland target."
              while IFS= read -r wd; do
                while IFS= read -r candidate; do
                  emit "$candidate" "$wd" "anland-wayland" "$DESKTOP_AUTOSTART" "none"
                done < <(desktop_wayland_targets_json "$wd" | jq -r '.[]')
              done < <(printf '%s\n' kde kde-mobile gnome anland-next)
            else
              case "$TARGET" in
                all)
                  while IFS= read -r candidate; do
                    if desktop_backend_supported "$candidate" "$DESKTOP" "$DISPLAY_BACKEND"; then
                      emit "$candidate" "$DESKTOP" "$DISPLAY_BACKEND" "$DESKTOP_AUTOSTART" "$PULSE_AUDIO"
                    fi
                  done < <(for dockerfile in *.Dockerfile; do basename "${dockerfile%.Dockerfile}"; done | sort)
                  ;;
                all-wayland)
                  [ "$DESKTOP" != "none" ] || fail \
                    "all-wayland requires at least one desktop." \
                    "all-wayland requires a desktop profile."
                  while IFS= read -r candidate; do
                    emit "$candidate" "$DESKTOP" "anland-wayland" "$DESKTOP_AUTOSTART" "none"
                  done < <(desktop_wayland_targets_json "$DESKTOP" | jq -r '.[]')
                  ;;
                *)
                  target_is_known "$TARGET" || fail \
                    "Unknown build target: $TARGET" \
                    "Unknown build target: $TARGET"
                  desktop_backend_supported "$TARGET" "$DESKTOP" "$DISPLAY_BACKEND" || fail \
                    "Unsupported distro/desktop/backend combination: $TARGET/$DESKTOP/$DISPLAY_BACKEND" \
                    "Unsupported target/profile/backend: $TARGET/$DESKTOP/$DISPLAY_BACKEND"
                  emit "$TARGET" "$DESKTOP" "$DISPLAY_BACKEND" "$DESKTOP_AUTOSTART" "$PULSE_AUDIO"
                  ;;
              esac
            fi
          done

          # remove duplicate rows (e.g. several desktops downgraded to none by systemd257)
          awk '!seen[$0]++' "$MATRIX_FILE" > "$MATRIX_FILE.dedup"
          mv "$MATRIX_FILE.dedup" "$MATRIX_FILE"

          MATRIX="$(jq -c -Rn '[inputs | split("\t") | {template: .[0], desktop: .[1], display_backend: .[2], autostart: .[3], pulseaudio: .[4]}]' < "$MATRIX_FILE")"
          [ "$MATRIX" != "[]" ] || fail \
            "No distro supports the selected desktop/backend combination." \
            "No target supports the selected desktop/backend combination."

          SUMMARY_DESKTOP="$(jq -r '[.[].desktop] | unique | join(", ")' <<< "$MATRIX")"
          SUMMARY_AUTOSTART="$(jq -r '[.[].autostart] | unique | join(", ")' <<< "$MATRIX")"
          SUMMARY_BACKEND="$(jq -r '[.[].display_backend] | unique | join(", ")' <<< "$MATRIX")"
          SUMMARY_PULSE="$(jq -r '[.[].pulseaudio] | unique | join(", ")' <<< "$MATRIX")"

          # human-readable variants for the release notes
          SUMMARY_DESKTOP_LABEL=""
          while IFS= read -r d; do
            [ -n "$d" ] || continue
            label="$(desktop_label "$d" 2>/dev/null || printf '%s' "$d")"
            if [ -z "$SUMMARY_DESKTOP_LABEL" ]; then
              SUMMARY_DESKTOP_LABEL="$label"
            else
              SUMMARY_DESKTOP_LABEL="$SUMMARY_DESKTOP_LABEL, $label"
            fi
          done < <(jq -r '[.[].desktop] | unique | .[]' <<< "$MATRIX")

          SUMMARY_BACKEND_LABEL=""
          while IFS= read -r b; do
            [ -n "$b" ] || continue
            label="$(display_backend_label "$b" 2>/dev/null || printf '%s' "$b")"
            if [ -z "$SUMMARY_BACKEND_LABEL" ]; then
              SUMMARY_BACKEND_LABEL="$label"
            else
              SUMMARY_BACKEND_LABEL="$SUMMARY_BACKEND_LABEL, $label"
            fi
          done < <(jq -r '[.[].display_backend] | unique | .[]' <<< "$MATRIX")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "desktop=$SUMMARY_DESKTOP" >> "$GITHUB_OUTPUT"
          echo "desktop_autostart=$SUMMARY_AUTOSTART" >> "$GITHUB_OUTPUT"
          echo "display_backend=$SUMMARY_BACKEND" >> "$GITHUB_OUTPUT"
          echo "pulseaudio_effective=$SUMMARY_PULSE" >> "$GITHUB_OUTPUT"
          message "Final decided build matrix: $MATRIX"
          message "Desktop profiles: $SUMMARY_DESKTOP_LABEL"
          message "Desktop auto-start: $SUMMARY_AUTOSTART"
          message "Display backends: $SUMMARY_BACKEND_LABEL"
          message "Wayland package repository: $WAYLAND_PACKAGE_REPOSITORY" \
            "Wayland package repository: $WAYLAND_PACKAGE_REPOSITORY"
          message "Final PulseAudio value: $SUMMARY_PULSE"

      - name: 'Prepare build metadata'
        id: prep
        env:
          UI_LANGUAGE: ${{ inputs.ui_language }}
          BUILD_ID_INPUT: ${{ inputs.build_id }}
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S')
          BUILD_ID="${BUILD_ID_INPUT:-v$(date +'%Y%m%d-%H%M%S')}"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          if [ "$UI_LANGUAGE" = zh ]; then
            echo "Build ID: $BUILD_ID"
          else
              echo "Build ID: $BUILD_ID"
          fi

  # --------------------------------------------------------
  # Phase 2: build (Build of regular Linux distribution RootFS)
  # --------------------------------------------------------
  build:
    name: format('Build {0}/{1}', matrix.template, matrix.desktop)
    needs: setup
    if: ${{ needs.setup.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: format('Build RootFS ({0}/{1})', matrix.template, matrix.desktop)
        env:
          ANLAND_RELEASE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
          ANLAND_MAJOR: ${{ inputs.anland_major }}
          ANLAND6_VERSION: ${{ inputs.anland6_version }}
          ANLAND6_XWAYLAND: "0"
        run: |
          chmod +x build_rootfs-native.sh
          ./build_rootfs-native.sh \
            -i "${{ matrix.template }}.Dockerfile" \
            -v "${{ needs.setup.outputs.build_id }}${{ inputs.asset_variant != '' && format('-{0}', inputs.asset_variant) || '' }}" \
            -K "${{ matrix.desktop }}" \
            -L "${{ matrix.autostart }}" \
            -B "${{ matrix.display_backend }}" \
            -P "${{ matrix.pulseaudio }}" \
            -g "${{ inputs.enable_zh_tz }}" \
            -a "${{ inputs.enable_binfmt }}" \
            -b "${{ inputs.enable_yj }}" \
            -c "${{ inputs.enable_mesa }}" \
            -d "${{ inputs.enable_kfgj }}" \
            -e "${{ inputs.enable_zip }}" \
            -f "${{ inputs.enable_docker }}" \
            -h "${{ inputs.enable_srf }}" \
            -n "${{ inputs.nosnap }}" \
            -S "${{ inputs.enable_systemd257 }}" \
            -t "${{ inputs.enable_8gen2_wayland }}" \
            -u "$CUSTOM_USERNAME" \
            -G "${{ inputs.gpu_vendor }}"

      - name: 'Upload build artifacts'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.template }}-${{ matrix.desktop }}-${{ inputs.asset_variant }}-${{ inputs.gpu_vendor }}-rootfs
          path: "*.tar.xz"
          retention-days: 1

  # --------------------------------------------------------
  # Phase 3: release (Summary and release)
  # --------------------------------------------------------
  release:
    name: 'Publish build results'
    needs: [setup, build]
    if: ${{ inputs.publish_release && !cancelled() && needs.setup.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 'Download all artifacts'
        uses: actions/download-artifact@v7
        with:
          pattern: "*-rootfs"
          merge-multiple: true

      - name: 'Organize release files'
        run: |
          mkdir -p release_assets
          mv *.tar.xz release_assets/
            # ---------------------------------------------------------------
            # Re-verify the compression stream before publishing
            #
            # The build stage already ran xz -t once, but the file then goes through
            # upload-artifact (zipped) and download-artifact (unzipped).
            # There are user reports of 832 MB archives reporting DATAERROR after this
            # relay while the size still matches -- corruption may happen in transit,
            #
            # which the build-time check cannot see. Re-verify here, right before the
            # release upload, and fail the release on a bad archive.
            # ---------------------------------------------------------------
            fail=0
            for f in release_assets/*.tar.xz; do
              [ -f "$f" ] || continue
              sz=$(stat -c %s "$f")
              if xz -t "$f" 2>/dev/null; then
                echo "[OK]   $(basename "$f")  $sz bytes  xz -t passed"
              else
                echo "::error:: $(basename "$f") xz -t failed ($sz bytes) -- the artifact relay may have corrupted it"
                fail=1
              fi
            done
            if [ "$fail" -ne 0 ]; then
              echo "::error:: compression stream verification failed, refusing to publish"
              exit 1
            fi
          # ---------------------------------------------------------------
          # Publish SHA256SUMS
          #
          # Without it users cannot tell whether a download is complete. Downloads of
          # an 872 MB archive via the GitHub HKG relay from CN networks were repeatedly
          # truncated (178 MB / 733 MB observed); the extraction error looks like a corrupt archive.
          #
          # Usage:
          #   sha256sum -c SHA256SUMS
          #   # or just compare sizes
          #   stat -c %s *.tar.xz
          # ---------------------------------------------------------------
          ( cd release_assets && sha256sum *.tar.xz > SHA256SUMS )
          echo "--- SHA256SUMS ---"
          cat release_assets/SHA256SUMS
          echo "--- file sizes ---"
          ls -l release_assets/

      - name: 'Prepare Release notes'
        env:
          UI_LANGUAGE: ${{ inputs.ui_language }}
          BUILD_TIME: ${{ needs.setup.outputs.build_date }}
          BUILD_TARGET: ${{ inputs.build_target }}
          BUILD_ID: ${{ needs.setup.outputs.build_id }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
          DESKTOP: ${{ needs.setup.outputs.desktop }}
          DESKTOP_AUTOSTART: ${{ needs.setup.outputs.desktop_autostart }}
          DISPLAY_BACKEND: ${{ needs.setup.outputs.display_backend }}
          WAYLAND_PACKAGE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          PULSE_AUDIO: ${{ needs.setup.outputs.pulseaudio_effective }}
          ENABLE_NOSNAP: ${{ inputs.nosnap }}
          ENABLE_SYSTEMD257: ${{ inputs.enable_systemd257 }}
          ENABLE_ZH_TZ: ${{ inputs.enable_zh_tz }}
          ENABLE_MESA: ${{ inputs.enable_mesa }}
          ENABLE_8GEN2_WAYLAND: ${{ inputs.enable_8gen2_wayland }}
          ENABLE_FCITX5: ${{ inputs.enable_srf }}
          ENABLE_BINFMT: ${{ inputs.enable_binfmt }}
          ENABLE_HARDWARE: ${{ inputs.enable_yj }}
          ENABLE_DEV_TOOLS: ${{ inputs.enable_kfgj }}
          ENABLE_COMPRESSION: ${{ inputs.enable_zip }}
          ENABLE_DOCKER: ${{ inputs.enable_docker }}
        run: |
          set -euo pipefail
          if [ "$UI_LANGUAGE" = zh ]; then
            cat > release-notes.md <<EOF
          Droidspaces RootFS automatic build
          Build time: $BUILD_TIME
          Build target: $BUILD_TARGET
          
          > **Verify integrity after downloading.** Every release ships a `SHA256SUMS`.
          > Large archives fetched via GitHub relay nodes are prone to truncation, and a
          > truncated archive reports extraction errors that look like a corrupt file.
          >
          > ```sh
          > sha256sum -c SHA256SUMS      # verify
          > stat -c %s *.tar.xz          # or just compare sizes
          > ```
          >
          > If extraction fails midway with `Unexpected end of input` / `Compressed data is corrupt`,
          > suspect an incomplete download first and re-download.
          Build ID: $BUILD_ID

          Build options:
          - **Custom username**: $CUSTOM_USERNAME
          - **Desktop**: $DESKTOP
          - **Desktop autostart**: $DESKTOP_AUTOSTART
          - **Display backend**: $DISPLAY_BACKEND
          - Wayland package repository: $WAYLAND_PACKAGE_REPOSITORY
          - PulseAudio audio forwarding: $PULSE_AUDIO
          - Anland audio note: Wayland mode uses the Anland app's built-in audio, no PulseAudio needed
          - Remove Ubuntu Snap: $ENABLE_NOSNAP
          - systemd 257 legacy-kernel compatibility: $ENABLE_SYSTEMD257
          - Chinese UI + Shanghai timezone: $ENABLE_ZH_TZ
          - Qualcomm Snapdragon GPU support: $ENABLE_MESA
          - Fix Snapdragon 8 Gen 2 Wayland display glitch: $ENABLE_8GEN2_WAYLAND
          - Fcitx 5 input method support: $ENABLE_FCITX5
          - Cross-architecture support: $ENABLE_BINFMT
          - Container hardware/network identification: $ENABLE_HARDWARE
          - Developer tools: $ENABLE_DEV_TOOLS
          - Compression tools: $ENABLE_COMPRESSION
          - Docker: $ENABLE_DOCKER
          EOF
          else
            cat > release-notes.md <<EOF
          Droidspaces RootFS Automated Build
          Build Time: $BUILD_TIME
          Build Target (User Specified): $BUILD_TARGET
          Build ID: $BUILD_ID
          
          > **Verify the download before extracting.** Every release ships a `SHA256SUMS`
          > file. Large downloads through GitHub cache nodes are easily truncated, and a
          > truncated archive fails to extract in a way that looks like a corrupt package.
          >
          > ```sh
          > sha256sum -c SHA256SUMS      # verify
          > stat -c %s *.tar.xz          # or just check the size
          > ```
          >
          > An `Unexpected end of input` / `Compressed data is corrupt` partway through
          > extraction usually means an incomplete download -- fetch it again.

          Build Options:
          - **Custom Username**: $CUSTOM_USERNAME
          - **Desktop**: $DESKTOP
          - **Desktop auto-start**: $DESKTOP_AUTOSTART
          - **Display backend**: $DISPLAY_BACKEND
          - Wayland package repository: $WAYLAND_PACKAGE_REPOSITORY
          - PulseAudio Audio Forwarding: $PULSE_AUDIO
          - Anland audio note: Wayland mode uses the built-in Anland app audio, so PulseAudio is not needed
          - nosnap: $ENABLE_NOSNAP
          - systemd 257 old-kernel compatibility: $ENABLE_SYSTEMD257
          - Use Chinese as Primary Language: $ENABLE_ZH_TZ
          - Qualcomm Snapdragon GPU Support: $ENABLE_MESA
          - Fix Snapdragon 8 Gen 2 Wayland display corruption: $ENABLE_8GEN2_WAYLAND
          - Input Method Fcitx 5 Support: $ENABLE_FCITX5
          - Cross-architecture Support: $ENABLE_BINFMT
          - Container Hardware and Network Recognition Support: $ENABLE_HARDWARE
          - Development Tools Integration: $ENABLE_DEV_TOOLS
          - Compression Tools Integration: $ENABLE_COMPRESSION
          - Docker Integration: $ENABLE_DOCKER
          EOF
          fi

      - name: 'Stage draft Release and upload assets'
        id: stage-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.build_id }}
          target_commitish: ${{ github.sha }}
          name: format('Droidspaces RootFS {0}', needs.setup.outputs.build_id)
          files: "release_assets/*"
          body_path: release-notes.md

          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 'Publish staged Release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.stage-release.outputs.id }}
          REPOSITORY: ${{ github.repository }}
          UI_LANGUAGE: ${{ inputs.ui_language }}
        run: |
          set -euo pipefail
          case "$RELEASE_ID" in
            ''|*[!0-9]*)
              if [ "$UI_LANGUAGE" = zh ]; then
                echo "The Release call did not return a valid draft release ID." >&2
              else
                echo "Release action did not return a valid draft Release ID." >&2
              fi
              exit 1
              ;;
          esac
          gh api \
            --method PATCH \
            "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            --silent
