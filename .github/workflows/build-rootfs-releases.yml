name: Build and publish Droidspaces RootFS

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Distro to build
        required: true
        type: choice
        default: Debian-13
        options:
          - Debian-13
          - Ubuntu-24
          - Ubuntu-25
          - Ubuntu-26
          - Fedora-43
          - Fedora-44
          - Arch
          - all
          - all-wayland
      custom_username:
        description: Custom username
        required: false
        type: string
        default: Gold
      desktop:
        description: Primary desktop (the one with autostart)
        required: true
        type: choice
        default: KDE
        options:
          - none
          - KDE
          - KDE mobile
          - Mobile
          - GNOME
          - Anland Next
          - Niri
          - Hyprland
          - Mango
          - Denial
      extra_desktops:
        description: "Extra desktops, comma-separated (e.g. Niri,Hyprland)"
        required: false
        type: string
        default: ""
      desktop_autostart:
        description: Desktop autostart (disabled automatically when the desktop is none)
        required: true
        type: boolean
        default: true
      display_backend:
        description: Display backend (KDE mobile/GNOME/Anland Next/Niri/Hyprland/Mango/Denial always use Anland Wayland)
        required: true
        type: choice
        default: anland-wayland
        options:
          - x11
          - anland-wayland
      PulseAudio:
        description: PulseAudio audio forwarding
        required: true
        type: choice
        default: socket
        options:
          - socket
          - tcp
          - none
      enable_zh_tz:
        description: Chinese UI + Shanghai timezone
        required: true
        type: boolean
        default: true
      enable_mesa:
        description: Qualcomm Snapdragon GPU support
        required: true
        type: boolean
        default: true
      enable_8gen2_wayland:
        description: Fix Snapdragon 8 Gen 2 Wayland display glitch
        required: true
        type: boolean
        default: false
      nosnap:
        description: Remove Ubuntu Snap
        required: true
        type: boolean
        default: true
      enable_systemd257:
        description: systemd 257 package family (only none and plain KDE)
        required: true
        type: boolean
        default: false
      enable_srf:
        description: Fcitx5 input method
        required: true
        type: boolean
        default: true
      enable_binfmt:
        description: Cross-architecture support
        required: true
        type: boolean
        default: false
      enable_yj:
        description: NAT and hardware identification
        required: true
        type: boolean
        default: true
      enable_kfgj:
        description: Developer tools
        required: true
        type: boolean
        default: false
      enable_zip:
        description: Compression tools
        required: true
        type: boolean
        default: true
      enable_docker:
        description: Docker
        required: true
        type: boolean
        default: false
      wayland_package_repository:
        description: Wayland package repository (public owner/repo)
        required: true
        type: string
        default: Goldzxcbug/droidspaces-package
      anland_major:
        description: 'Anland major version (6 = anlandx session, 5 = legacy patched KWin)'
        required: false
        type: choice
        default: '6'
        options:
          - '6'
          - '5'
      anland6_version:
        description: 'The anland 6.x release tag'
        required: false
        type: string
        default: '6.2'
      gpu_vendor:
        description: GPU vendor (qualcomm = Adreno hardware acceleration; mediatek = libhybris + /dev/mali0, requires mali_nsfix)
        required: true
        type: choice
        default: qualcomm
        options:
          - qualcomm
          - mediatek

permissions:
  contents: write

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: zh
      build_target: ${{ inputs.build_target }}
      custom_username: ${{ inputs.custom_username }}
      desktop: ${{ inputs.desktop }}
      extra_desktops: ${{ inputs.extra_desktops }}
      desktop_autostart: ${{ inputs.desktop_autostart }}
      display_backend: ${{ inputs.display_backend }}
      PulseAudio: ${{ inputs.PulseAudio }}
      enable_zh_tz: ${{ inputs.enable_zh_tz }}
      enable_mesa: ${{ inputs.enable_mesa }}
      enable_8gen2_wayland: ${{ inputs.enable_8gen2_wayland }}
      nosnap: ${{ inputs.nosnap }}
      enable_systemd257: ${{ inputs.enable_systemd257 }}
      enable_srf: ${{ inputs.enable_srf }}
      enable_binfmt: ${{ inputs.enable_binfmt }}
      enable_yj: ${{ inputs.enable_yj }}
      enable_kfgj: ${{ inputs.enable_kfgj }}
      enable_zip: ${{ inputs.enable_zip }}
      enable_docker: ${{ inputs.enable_docker }}
      wayland_package_repository: ${{ inputs.wayland_package_repository }}
      gpu_vendor: ${{ inputs.gpu_vendor }}
