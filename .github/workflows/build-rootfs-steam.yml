name: Publish Steam Gaming RootFS

on:
  workflow_dispatch:
    inputs:
      gpu_vendor:
        type: choice
        default: both
        options: [both, qualcomm, mediatek]

concurrency:
  group: droidspaces-rootfs-steam
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.meta.outputs.build_id }}
    steps:
      - id: meta
        run: |
          echo "build_id=v$(date -u +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  build-zh-qualcomm:
    needs: prepare
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      ui_language: zh
      build_target: custom
      desktop: steam-gaming
      display_backend: anland-wayland
      enable_mesa: true
      wayland_package_repository: Goldzxcbug/droidspaces-package
      build_id: ${{ needs.prepare.outputs.build_id }}
      gpu_vendor: qualcomm
      publish_release: false
