# Build an x86_64 Turnip that can actually reach an Android GPU.
#
# The probe established exactly where the wall is, and it is not box64:
#   * box64 forwards open() and DRM ioctls correctly on this device
#     (/dev/kgsl-3d0 and /dev/dri/renderD128 both open, DRM_IOCTL_VERSION returns
#     a real version number under emulation)
#   * the x86_64 Turnip from Arch loads, resolves every symbol, and runs to
#     completion once call_once is shimmed and the emulated graphics stack is used
#   * but it reports no physical device, because Arch's desktop build carries no
#     kgsl backend at all: its .so contains zero occurrences of "kgsl-3d0" and one
#     of "kgsl", against 1 and 13 respectively in the aarch64 Android build that
#     works on this device
#
# Android exposes the GPU through kgsl, not through desktop DRM, so a Turnip
# built for a desktop distro cannot see it. This job builds one with
# freedreno-kgsl enabled and proves the string is present before uploading.
name: Build x86_64 Turnip with kgsl

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: Mesa tag or branch to build
        required: false
        default: mesa-26.3.1
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Turnip x86_64 + kgsl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          set -uo pipefail
          sudo apt-get update
          # Required for a Vulkan-only freedreno build.
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config python3-pip \
            bison flex libdrm-dev libexpat1-dev libzstd-dev zlib1g-dev \
            libwayland-dev libelf-dev glslang-tools python3-mako
          # Optional: only needed if Turnip pulls these WSI paths in. Installed
          # one by one because distro spellings differ (libxcb-shm0-dev, not
          # libxcb-shm-dev) and a single wrong name must not fail the whole job.
          for p in libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev \
                   libxcb-present-dev libxcb-shm0-dev libxcb-randr0-dev \
                   libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev; do
            sudo apt-get install -y --no-install-recommends "$p" \
              || echo "::warning::optional package unavailable: $p"
          done
          pip3 install --break-system-packages mako pyyaml

      - name: Clone Mesa
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.mesa_ref }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa
          echo "checked out: $(git -C mesa rev-parse --short HEAD)"

      # src/freedreno/vulkan/meson.build gates the backend on
      #   if freedreno_kmds.contains('kgsl')
      #     tu_flags += '-DTU_HAS_KGSL'
      #     libtu_files += files('tu_knl_kgsl.cc')
      # so the switch is the freedreno-kmds array, not a boolean. Arch's desktop
      # package leaves it at the msm default, which is why its .so has no kgsl
      # strings at all.
      - name: Configure
        run: |
          set -euo pipefail
          cd mesa
          LDFLAGS="-static-libstdc++ -static-libgcc" \
          meson setup build \
            --buildtype=release \
            -Dvulkan-drivers=freedreno \
            -Dgallium-drivers= \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=enabled \
            -Dplatforms=x11,wayland,drm \
            -Dllvm=disabled \
            -Dvideo-codecs= \
            -Dcpp_link_args="-static-libstdc++ -static-libgcc" \
            -Dc_link_args="-static-libgcc" \
            -Dfreedreno-kmds=kgsl

      - name: Build libvulkan_freedreno.so
        run: |
          set -euo pipefail
          cd mesa
          ninja -C build src/freedreno/vulkan/libvulkan_freedreno.so
          SO=$(find build -name 'libvulkan_freedreno.so*' -type f | head -1)
          echo "built: $SO"
          ls -l "$SO"
          cp "$SO" "$GITHUB_WORKSPACE/libvulkan_freedreno.x86_64.so"

      # The whole point of this build: the kgsl backend must be compiled in.
      # Arch's desktop .so has zero occurrences of "kgsl-3d0"; ours must not.
      - name: Verify the kgsl backend is present
        run: |
          set -euo pipefail
          SO=libvulkan_freedreno.x86_64.so
          echo "file: $(file -b "$SO")"
          n_dev=$(grep -ac 'kgsl-3d0' "$SO" || true)
          n_kgsl=$(grep -ac 'kgsl' "$SO" || true)
          wsi_missing=0
          echo "kgsl-3d0 occurrences: $n_dev"
          echo "kgsl occurrences    : $n_kgsl"
          echo "(reference: Arch desktop build = 0 and 1; aarch64 Android build = 1 and 13)"
          if [ "$n_dev" -eq 0 ] && [ "$n_kgsl" -le 1 ]; then
            echo "::error::the kgsl backend was not compiled in — this .so cannot see an Android GPU"
            exit 1
          fi
          echo "kgsl backend present"

          # Headless-only is useless here: a game has to present to an anland
          # window, and with -Dplatforms= the driver exposes only
          # VK_EXT_headless_surface (present support false), which is exactly the
          # state this build was in before. Require the real surface extensions.
          echo "--- WSI surface extensions ---"
          for ext in VK_KHR_xcb_surface VK_KHR_xlib_surface VK_KHR_wayland_surface; do
            if grep -aq "$ext" "$SO"; then
              echo "  ok   $ext"
            else
              echo "  MISS $ext"
              wsi_missing=$((wsi_missing + 1))
            fi
          done
          if [ "${wsi_missing:-0}" -gt 0 ]; then
            echo "::error::the driver has no usable window-system integration; a game could not present"
            exit 1
          fi
          echo "WSI present"

          # Mesa refuses -Dgbm=enabled unless a DRM/KMS platform is present
          # ('GBM only supports DRM/KMS platforms'), which is why platforms
          # includes drm above even though the driver is Vulkan-only.
          #
          # Mesa's Wayland WSI allocates swapchain images through GBM. With
          # -Dgbm=disabled the surface can be created and its capabilities
          # queried — which is all vulkaninfo does, so earlier checks passed —
          # but the first real image allocation calls through a null allocator
          # and the process dies at pc=0x1. Gate on it.
          echo "--- GBM allocator ---"
          if grep -aq 'gbm_bo_create' "$SO"; then
            echo "  ok   gbm_bo_create"
          else
            echo "::error::no GBM allocator; swapchain creation would crash at first present"
            exit 1
          fi
          # With libstdc++ linked statically the once-call state becomes
          # library-local, so the driver should carry no dynamic dependency on
          # libstdc++ and no TLSDESC relocation for __once_call — the exact
          # relocation box64 refuses.
          echo "--- dynamic libstdc++ dependency ---"
          if readelf -d "$SO" 2>/dev/null | grep -q 'libstdc++'; then
            echo "::warning::still linking libstdc++ dynamically; TLSDESC will likely return"
          else
            echo "static: no dynamic libstdc++ dependency"
          fi
          sha256sum "$SO" | tee SHA256SUMS

      - uses: actions/upload-artifact@v6
        with:
          name: turnip-x86_64-kgsl
          path: |
            libvulkan_freedreno.x86_64.so
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14
