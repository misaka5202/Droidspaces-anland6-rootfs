name: Verify Release asset integrity

# Manual dispatch: download the tagged assets and run xz -t to answer "is this archive corrupt or not".
#
# Why in CI: an 832 MB archive fetched via the GitHub relay from CN networks is repeatedly truncated,
# and a complete local copy is hard to get. Runners reach GitHub over the internal network and download it in seconds.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to verify (e.g. v20261115-124300)'
        required: true
        type: string
      asset_pattern:
        description: 'Only verify matching assets (empty = all .tar.xz)'
        required: false
        type: string
        default: '*.tar.xz'

jobs:
  verify:
    name: Download and verify
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "${{ inputs.tag }}" \
             --repo "${{ github.repository }}" \
             --pattern "${{ inputs.asset_pattern }}" \
             --dir dl --clobber
          echo "--- download results ---"
          ls -l dl/

      - name: xz -t verification
        run: |
          set -uo pipefail
          fail=0
          for f in dl/*; do
            [ -f "$f" ] || continue
            sz=$(stat -c %s "$f")
            echo "=== $(basename "$f")   $sz bytes ==="
            # footer (xz ends with 59 5a 'YZ')
            echo -n "  last 12 bytes: "; tail -c 12 "$f" | od -An -tx1 | tr -d '\n'; echo
            if xz -t "$f" 2>&1; then
              echo "  OK xz -t passed (stream intact)"
            else
              echo "  FAILED xz -t"
              fail=1
            fi
            echo -n "  sha256: "; sha256sum "$f" | awk '{print $1}'
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error:: one or more assets have a corrupt compression stream"
            exit 1
          fi
          echo "all passed"

      - name: Also check the artifact copies
        run: |
          # Release assets arrive via the artifact relay. If the original artifacts are
          # reachable here, one can tell whether corruption happened before or after the relay.
          echo "This step is left as an extension: to compare artifact vs release assets,"
          echo "keep an extra copy of the artifacts from the build run and diff them."
