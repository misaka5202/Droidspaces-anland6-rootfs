# anland: give the container's PipeWire core a sink that reaches Android.
#
# The desktop images install pipewire + pipewire-pulse + wireplumber. Without
# an output device the core's only real sink is the auto_null fallback, so
# native PipeWire clients (pw-cat/pw-play, OBS, games, Plasma's own sounds)
# play into silence: ~/.config/pulse/client.conf does not reach them, because
# they never speak libpulse.
#
# libpipewire-module-pulse-tunnel is a sink that tunnels to a remote
# PulseAudio server. The anland host daemon exposes one at
# <ANLAND_RUNTIME_DIR>/pulse.sock (bind-mounted into the container at
# /run/anland, anonymous auth), which renders into Android via the host's
# OpenSL ES sink. The tunnel is the only real sink in the image, so
# WirePlumber makes it the default.
#
# Installed only in the anland-wayland images (see the Dockerfiles). If the
# socket is absent the module logs a connection error and leaves the core's
# previous behaviour untouched.
context.modules = [
    { name = libpipewire-module-pulse-tunnel
      args = {
          tunnel.mode = "sink"
          pulse.server.address = "unix:/run/anland/pulse.sock"
          node.name = "anland"
          node.description = "Android (anland)"
      }
    }
]
