#
# anland PipeWire tunnel — container side.
#
# Two tunnels are configured:
#
#   sink   (anland)       the container's audio output.  It tunnels into the
#                         host PulseAudio, which renders it through the
#                         OpenSL ES sink into Android.
#
#   source (anland_mic)   the container's audio input.  The host PulseAudio
#                         exposes an "android_microphone" source (the sles
#                         SOURCE module records through the anland APK), and
#                         tunnel.mode = "source" turns that remote source into
#                         a local PipeWire source.
#
# The adapter module is required: a raw capture stream cannot be connected to
# the tunnel source directly, without it the stream stays in "connecting" and
# never receives a buffer.
#
# The host PulseAudio cookie is published by the anland module in the runtime
# directory, which is bind-mounted here as /run/anland.  It authenticates the
# tunnel against the host server; without it the anonymous handshake is
# rejected and the tunnel reports "can't connect: Host is down".
#
# Installed only in the anland-wayland images (see the Dockerfiles).  If the
# socket is absent the module logs a connection error and leaves the core's
# previous behaviour untouched.
context.modules = [
    { name = libpipewire-module-pulse-tunnel
      args = {
          tunnel.mode = "sink"
          pulse.server.address = "unix:/run/anland/pulse.sock"
          node.name = "anland"
          node.description = "Android (anland)"
      }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-pulse-tunnel
      args = {
          tunnel.mode = "source"
          pulse.server.address = "unix:/run/anland/pulse.sock"
          node.name = "anland_mic"
          node.description = "Android Microphone (anland)"
      }
      flags = [ ifexists nofail ]
    }
    # Capture streams need an adapter between the tunnel source and the
    # client stream, otherwise the stream never leaves the "connecting" state.
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
]
